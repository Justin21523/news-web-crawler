services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NEWS_DATA_DIR: /data
      NEWS_DB_PATH: /data/news.db
      NEWS_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8011:8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8011/api/v1
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
